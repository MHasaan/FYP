server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large video uploads (ngrok free tier caps at 100MB)
    client_max_body_size 500M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    # Flutter web app - SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy WebSocket connections
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Flutter shell files change every build but keep the same URL (no
    # content hashing), so they MUST NOT be cached. Otherwise the browser
    # sticks to whatever bundle it loaded first and never picks up new
    # code — Cache-Control: immutable below would freeze them forever.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /main.dart.js {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /flutter.js {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /manifest.json {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Long-cache other static assets (fonts, images, code-split chunks
    # with content-hashed names — these are safe to cache forever).
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /canvaskit/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
