services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  database:
    image: postgres:16-alpine
    container_name: fyp-database
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis (Inter-service messaging)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: fyp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend API (FastAPI)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fyp-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Set FCM_CREDENTIALS_PATH in .env to enable real push delivery.
      # Defaults to the mounted credentials path below.
      - FCM_CREDENTIALS_PATH=${FCM_CREDENTIALS_PATH:-/app/credentials/fcm-service-account.json}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./videos:/videos
      - ./backend/credentials:/app/credentials:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================
  # ML Manager (Pipeline Orchestrator + Models)
  # ============================================
  ml_manager:
    build:
      # Context is the repo root so the Dockerfile can COPY both the
      # ml_manager tree and the in-repo GroundingDINO/ source (no build-time
      # git clone — see ml_manager/Dockerfile).
      context: .
      dockerfile: ml_manager/Dockerfile
      args:
        # Override on a single-GPU dev machine to shrink build time, e.g.:
        #   TORCH_CUDA_ARCH_LIST=7.5      (RTX 2060/2070/2080)
        #   TORCH_CUDA_ARCH_LIST=8.6      (RTX 3060/3070/3080/3090)
        #   TORCH_CUDA_ARCH_LIST=8.9      (RTX 4060/4070/4080/4090)
        # The default below covers every common arch — keeps the image
        # portable but adds a few minutes to the GroundingDINO compile.
        TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-7.0;7.5;8.0;8.6;8.9;9.0+PTX}
    container_name: fyp-ml-manager
    restart: unless-stopped
    env_file: .env
    environment:
      # Visual Search runs the real GroundingDINO by default now. Flip to
      # 1 if you want the stub for local UI testing without the real
      # model loaded. See ml_manager/manager/gdino_loader.py for details.
      - GDINO_USE_STUB=${GDINO_USE_STUB:-0}
      # GroundingDINO inference resolution. Keep at training values (800/1333).
      # Going higher collapses confidence scores to near-zero (0 detections).
      # Small-object recall is handled by tiling below, not by raising these.
      - GDINO_SHORT_SIDE=${GDINO_SHORT_SIDE:-800}
      - GDINO_MAX_SIZE=${GDINO_MAX_SIZE:-1333}
      # Tiled inference: splits each image into a ROWS×COLS grid with OVERLAP
      # fraction of shared border. Each tile is processed independently so
      # small/far objects appear larger relative to the model input.
      # Full image is always processed too for global context.
      - GDINO_TILE_ROWS=${GDINO_TILE_ROWS:-2}
      - GDINO_TILE_COLS=${GDINO_TILE_COLS:-2}
      - GDINO_TILE_OVERLAP=${GDINO_TILE_OVERLAP:-0.25}
      - GDINO_NMS_IOU=${GDINO_NMS_IOU:-0.5}
    ports:
      - "${ML_MANAGER_PORT:-8001}:8001"
    volumes:
      - ./ml_manager/manager:/app/manager
      - ./ml_manager/steps:/app/steps
      - ./ml_manager/models:/app/models
      - ./videos:/videos
      - ./ml_manager/cache:/root/.cache
      # NOTE: GroundingDINO is now cloned + installed inside the image at
      # build time (see ml_manager/Dockerfile). No host-side ./GroundingDINO
      # mount — that used to mask the image's copy with an empty dir on
      # fresh-clone machines.
    depends_on:
      redis:
        condition: service_healthy
    # GPU passthrough — required for GroundingDINO + ultralytics + pose models
    # to actually use the host's NVIDIA GPU. Without this the container runs
    # CPU-only despite the NVIDIA base image.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ============================================
  # Flutter Web (Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No API_BASE_URL/WS_BASE_URL args needed — the web app uses relative
      # URLs (same-origin via nginx proxy) so it works from localhost AND ngrok
      # without a rebuild when the tunnel URL changes.
    container_name: fyp-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  # ============================================
  # ngrok Tunnel (public HTTPS access)
  # ============================================
  ngrok:
    image: ngrok/ngrok:latest
    container_name: fyp-ngrok
    restart: unless-stopped
    command: http frontend:80 --domain=${NGROK_DOMAIN} --log=stdout
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - frontend

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: fyp-network
