services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  database:
    image: postgres:16-alpine
    container_name: fyp-database
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis (Inter-service messaging)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: fyp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend API (FastAPI)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fyp-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Set FCM_CREDENTIALS_PATH in .env to enable real push delivery.
      # Defaults to the mounted credentials path below.
      - FCM_CREDENTIALS_PATH=${FCM_CREDENTIALS_PATH:-/app/credentials/fcm-service-account.json}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./videos:/videos
      - ./backend/credentials:/app/credentials:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================
  # ML Manager (Pipeline Orchestrator + Models)
  # ============================================
  ml_manager:
    build:
      # Context is the repo root so the Dockerfile can COPY both
      # ml_manager/ AND GroundingDINO/. GroundingDINO has to be in the
      # build context to compile its custom CUDA op at image-build time.
      context: .
      dockerfile: ml_manager/Dockerfile
    container_name: fyp-ml-manager
    restart: unless-stopped
    env_file: .env
    environment:
      # Visual Search runs the real GroundingDINO by default now. Flip to
      # 1 if you want the stub for local UI testing without the real
      # model loaded. See ml_manager/manager/gdino_loader.py for details.
      - GDINO_USE_STUB=${GDINO_USE_STUB:-0}
    ports:
      - "${ML_MANAGER_PORT:-8001}:8001"
    volumes:
      - ./ml_manager/manager:/app/manager
      - ./ml_manager/steps:/app/steps
      - ./ml_manager/models:/app/models
      - ./videos:/videos
      - ./ml_manager/cache:/root/.cache
      # Mount the GroundingDINO source tree read-only so the loader can
      # import its modules without needing a separate pip install. The
      # custom CUDA op still requires `pip install -e` to compile —
      # see gdino_loader.py.
      - ./GroundingDINO:/app/GroundingDINO:ro
    depends_on:
      redis:
        condition: service_healthy
    # GPU passthrough — required for GroundingDINO + ultralytics + pose models
    # to actually use the host's NVIDIA GPU. Without this the container runs
    # CPU-only despite the NVIDIA base image.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ============================================
  # Flutter Web (Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
        WS_BASE_URL: ${WS_BASE_URL:-ws://localhost:8000}
    container_name: fyp-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: fyp-network
