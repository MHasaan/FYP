services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  database:
    image: postgres:16-alpine
    container_name: fyp-database
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis (Inter-service messaging)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: fyp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend API (FastAPI)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fyp-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./videos:/videos:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================
  # ML Manager (Pipeline Orchestrator + Models)
  # ============================================
  ml_manager:
    build:
      context: ./ml_manager
      dockerfile: Dockerfile
    container_name: fyp-ml-manager
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ML_MANAGER_PORT:-8001}:8001"
    volumes:
      - ./ml_manager/manager:/app/manager
      - ./ml_manager/steps:/app/steps
      - ./ml_manager/models:/app/models
      - ./videos:/videos
      - ./ml_manager/cache:/root/.cache
    depends_on:
      redis:
        condition: service_healthy
    # GPU runtime for NVIDIA CUDA acceleration
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  # ============================================
  # Flutter Web (Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
        WS_BASE_URL: ${WS_BASE_URL:-ws://localhost:8000}
    container_name: fyp-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: fyp-network
